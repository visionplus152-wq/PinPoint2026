<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Landing Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      background: #faf7f8;
      color: #333;
    }

    /* Sakura Animation Canvas Structure */
    .sakura-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
    }

    .petal {
      position: absolute;
      background-color: #ffb7c5;
      border-radius: 150% 0 150% 0;
      opacity: 0.7;
      pointer-events: none;
      animation: fall linear infinite;
    }

    /* Original Left/Right Animations */
    @keyframes fall {
      0% {
        top: -10%;
        transform: translateX(0) rotate(0deg);
      }
      100% {
        top: 100%;
        transform: translateX(100px) rotate(360deg);
      }
    }

    /* NEW: Dedicated Mid-page Falling Animation */
    .petal-center {
      left: 50% !important;
      animation: fall-center 6s ease-in-out infinite !important;
    }

    @keyframes fall-center {
      0% {
        top: -10%;
        transform: translateX(-50%) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      50% {
        transform: translateX(calc(-50% + 40px)) rotate(180deg) scale(1.1);
      }
      100% {
        top: 105%;
        transform: translateX(calc(-50% - 30px)) rotate(360deg) scale(0.9);
        opacity: 0.2;
      }
    }

    /* Hero Section */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #2c2c2c;
    }

    .hero p {
      font-size: 1.25rem;
      max-width: 600px;
      margin-bottom: 2rem;
      color: #666;
    }

    /* NEW: Darker Color & Faster Pulse CTA Button */
    .cta-button {
      background-color: #b8295b; /* Darker cherry blossom pink/rose */
      color: #ffffff;
      padding: 1rem 2.5rem;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(184, 41, 91, 0.3);
      transition: background-color 0.2s ease, transform 0.2s ease;
      /* Speeded up animation cycle to 1.2s */
      animation: cta-pulse 1.2s infinite ease-in-out; 
    }

    .cta-button:hover {
      background-color: #961d47; /* Even darker shade on hover */
      transform: translateY(-2px);
    }

    /* Faster CTA Pulse Keyframes */
    @keyframes cta-pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(184, 41, 91, 0.6);
      }
      70% {
        box-shadow: 0 0 0 16px rgba(184, 41, 91, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(184, 41, 91, 0);
      }
    }
  </style>
</head>
<body>

  <!-- Background Sakura Overlay -->
  <div class="sakura-container">
    <!-- Existing Petals -->
    <div class="petal" style="left: 10%; width: 15px; height: 12px; animation-duration: 8s;"></div>
    <div class="petal" style="left: 25%; width: 20px; height: 16px; animation-duration: 10s; animation-delay: 2s;"></div>
    <div class="petal" style="left: 75%; width: 14px; height: 10px; animation-duration: 7s; animation-delay: 1s;"></div>
    <div class="petal" style="left: 85%; width: 18px; height: 14px; animation-duration: 9s; animation-delay: 3s;"></div>
    
    <!-- NEW: Additional Sakura Petal stream focused down the middle -->
    <div class="petal petal-center" style="width: 22px; height: 16px; animation-delay: 0s;"></div>
    <div class="petal petal-center" style="width: 16px; height: 12px; animation-delay: 3s;"></div>
  </div>

  <!-- Hero Content (Logo and Home Header Link Removed) -->
  <section class="hero">
    <h1>Welcome to Quiet Horizons</h1>
    <p>Discover peaceful travel, sustainable destinations, and curated outdoor experiences.</p>
    
    <!-- Darker & Faster Animating CTA -->
    <a href="#explore" class="cta-button">Explore Destinations</a>
  </section>

</body>
</html>
