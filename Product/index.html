<style>
  /* =====================================================
     NEW FEATURE SECTION THEME
     Less clutter. More room to travel.
  ====================================================== */

  .section-white {
    position: relative;
    overflow: hidden;

    background:
      radial-gradient(
        circle at 10% 15%,
        rgba(124, 108, 255, .09),
        transparent 28%
      ),
      radial-gradient(
        circle at 90% 85%,
        rgba(45, 179, 255, .10),
        transparent 30%
      ),
      #f5f7fc;
  }


  /* Decorative background glow */

  .section-white::before {
    content: "";

    position: absolute;

    width: 420px;
    height: 420px;

    left: -220px;
    top: 180px;

    border-radius: 50%;

    background:
      radial-gradient(
        circle,
        rgba(107, 91, 255, .10),
        transparent 68%
      );

    pointer-events: none;
  }


  .section-white::after {
    content: "";

    position: absolute;

    width: 360px;
    height: 360px;

    right: -180px;
    bottom: 80px;

    border-radius: 50%;

    border:
      1px solid rgba(95, 111, 255, .08);

    pointer-events: none;
  }


  /* =====================================================
     HEADING
  ====================================================== */

  .section-white .section-heading {
    position: relative;
    z-index: 2;

    max-width: 820px;

    margin-bottom: 62px;
  }


  .section-white .kicker {
    display: inline-flex;
    align-items: center;

    gap: 8px;

    padding: 7px 12px;

    color: #6557d8;

    background:
      rgba(101, 87, 216, .08);

    border:
      1px solid rgba(101, 87, 216, .15);

    border-radius: 100px;

    font-size: 9px;
    font-weight: 900;

    letter-spacing: 1.7px;
  }


  .section-white .section-heading h2 {
    margin-top: 16px;

    color: #10152a;

    font-size:
      clamp(38px, 4.8vw, 61px);

    line-height: 1;

    letter-spacing: -3px;
  }


  .section-white .section-heading p {
    max-width: 650px;

    margin:
      20px auto 0;

    color: #707a91;

    font-size: 15px;
  }


  /* =====================================================
     FEATURE GRID
  ====================================================== */

  .features-grid {
    position: relative;
    z-index: 2;

    display: grid;

    grid-template-columns:
      repeat(4, 1fr);

    gap: 20px;
  }


  /* =====================================================
     NEW FEATURE CARDS
  ====================================================== */

  .feature {
    position: relative;

    min-height: 315px;

    padding: 30px;

    overflow: hidden;

    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,.98),
        rgba(248,249,255,.96)
      );

    border:
      1px solid rgba(30, 40, 75, .08);

    border-radius: 25px;

    /* Layered drop shadow */

    box-shadow:
      0 4px 8px rgba(20, 27, 52, .035),
      0 12px 25px rgba(20, 27, 52, .055),
      0 28px 55px rgba(20, 27, 52, .075);

    transition:
      transform .35s cubic-bezier(.2,.8,.2,1),
      box-shadow .35s ease,
      border-color .35s ease;
  }


  /* Card top highlight */

  .feature::before {
    content: "";

    position: absolute;

    top: 0;
    left: 25px;
    right: 25px;

    height: 1px;

    background:
      linear-gradient(
        90deg,
        transparent,
        rgba(115, 101, 255, .35),
        transparent
      );
  }


  /* Card glow */

  .feature::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    right: -90px;
    bottom: -90px;

    border-radius: 50%;

    background:
      radial-gradient(
        circle,
        rgba(104, 89, 255, .12),
        transparent 70%
      );

    transition:
      transform .4s ease;
  }


  .feature:hover {
    transform:
      translateY(-10px);

    border-color:
      rgba(101, 87, 216, .18);

    box-shadow:
      0 8px 15px rgba(20, 27, 52, .04),
      0 20px 40px rgba(20, 27, 52, .08),
      0 40px 80px rgba(20, 27, 52, .12);
  }


  .feature:hover::after {
    transform: scale(1.35);
  }


  /* =====================================================
     FEATURE ICON
  ====================================================== */

  .feature-icon {
    position: relative;
    z-index: 2;

    width: 56px;
    height: 56px;

    display: grid;
    place-items: center;

    margin-bottom: 30px;

    color: #6557d8;

    background:
      linear-gradient(
        145deg,
        #f0efff,
        #e7f5ff
      );

    border:
      1px solid rgba(101, 87, 216, .12);

    border-radius: 17px;

    font-size: 23px;

    box-shadow:
      0 8px 20px rgba(101, 87, 216, .10);

    transition:
      transform .3s ease,
      box-shadow .3s ease;
  }


  .feature:hover .feature-icon {
    transform:
      translateY(-3px)
      rotate(-2deg);

    box-shadow:
      0 12px 28px rgba(101, 87, 216, .16);
  }


  /* =====================================================
     FEATURE TEXT
  ====================================================== */

  .feature h3 {
    position: relative;
    z-index: 2;

    color: #11162b;

    font-family:
      "Manrope",
      sans-serif;

    font-size: 18px;
    font-weight: 800;

    letter-spacing: -.4px;
  }


  .feature p {
    position: relative;
    z-index: 2;

    margin-top: 10px;

    color: #747e92;

    font-size: 13px;

    line-height: 1.75;
  }


  /* =====================================================
     NUMBER / MICRO LABEL
  ====================================================== */

  .feature:nth-child(1)::marker {
    display: none;
  }


  .feature:nth-child(1) {
    background:
      linear-gradient(
        145deg,
        #ffffff,
        #f6f4ff
      );
  }


  .feature:nth-child(2) {
    background:
      linear-gradient(
        145deg,
        #ffffff,
        #f3f9ff
      );
  }


  .feature:nth-child(3) {
    background:
      linear-gradient(
        145deg,
        #ffffff,
        #f5f5ff
      );
  }


  .feature:nth-child(4) {
    background:
      linear-gradient(
        145deg,
        #ffffff,
        #f2f9ff
      );
  }


  /* =====================================================
     RESPONSIVE
  ====================================================== */

  @media (max-width: 1100px) {

    .features-grid {
      grid-template-columns:
        repeat(2, 1fr);
    }

  }


  @media (max-width: 700px) {

    .section-white {
      padding:
        75px 0;
    }

    .section-white .section-heading {
      margin-bottom: 38px;
    }

    .section-white .section-heading h2 {
      font-size: 37px;

      letter-spacing: -2px;
    }

    .section-white .section-heading p {
      font-size: 13px;
    }

    .features-grid {
      grid-template-columns: 1fr;

      gap: 14px;
    }

    .feature {
      min-height: 255px;

      padding: 26px;

      border-radius: 22px;

      box-shadow:
        0 5px 12px rgba(20, 27, 52, .04),
        0 15px 30px rgba(20, 27, 52, .07),
        0 30px 55px rgba(20, 27, 52, .08);
    }

  }

</style>
